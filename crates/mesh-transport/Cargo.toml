[package]
name = "mesh-transport"
description = "Mesh's transport: authenticated QUIC between devices, dialled by device key"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mesh-identity.workspace = true
iroh.workspace = true
tokio.workspace = true
thiserror.workspace = true

[features]
# Trusting iroh's in-process test relay, for this crate's tests only.
test-utils = ["iroh/test-utils"]

[dev-dependencies]
iroh = { workspace = true, features = ["test-utils"] }
# The crate's own tests turn its test-utils feature on.
mesh-transport = { path = ".", features = ["test-utils"] }
