[package]
name = "mesh-node"
description = "Mesh's networking engine: Mesh-Voice's helper over stdio, or a headless seed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
mesh-dm.workspace = true
mesh-e2ee.workspace = true
mesh-identity.workspace = true
mesh-transport.workspace = true
postcard.workspace = true
serde.workspace = true
# Plugin state file names (voice-quality Task 5).
blake3.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
zeroize.workspace = true
cpal = { workspace = true, optional = true }
opus = { workspace = true, optional = true }
nnnoiseless = { workspace = true, optional = true }
sonora = { workspace = true, optional = true }
image = { workspace = true, optional = true }
symphonia = { workspace = true, optional = true }

[features]
default = ["audio", "profile-media"]
# Calls' audio (SPEC-calls C4). The seed's image builds without it: no ALSA
# or CMake there, and a seed makes no calls.
audio = ["dep:cpal", "dep:opus", "dep:nnnoiseless", "dep:sonora"]
# Decoding friends' profile pictures and songs (SPEC-profile PR8). The seed
# shows no profiles, so its image builds without it.
profile-media = ["dep:image", "dep:symphonia", "dep:opus"]

[dev-dependencies]
# A plain-http relay on loopback for the two-helper test, so the helper never
# needs to trust a self-signed relay. Same crate and version iroh already uses.
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
tokio.workspace = true
