[package]
name = "mesh-node"
description = "Mesh's networking engine: Mesh-Voice's helper over stdio, or a headless seed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
mesh-identity.workspace = true
mesh-transport.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
zeroize.workspace = true

[dev-dependencies]
# A plain-http relay on loopback for the two-helper test, so the helper never
# needs to trust a self-signed relay. Same crate and version iroh already uses.
iroh-relay = { version = "=1.4.1", default-features = false, features = ["server", "tls-ring"] }
tokio.workspace = true
