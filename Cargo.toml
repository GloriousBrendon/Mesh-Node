[workspace]
resolver = "3"
members = ["crates/mesh-dm", "crates/mesh-e2ee", "crates/mesh-identity", "crates/mesh-node", "crates/mesh-transport"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

# Every dependency is justified here (design/mesh/SPEC-identity.md and SPEC-transport.md, in Mesh-Voice).
[workspace.dependencies]
# Keys and signatures; the major version iroh 1.x uses, so device keys pass straight to transport.
ed25519-dalek = { version = "3", features = ["rand_core", "zeroize"] }
# Keystore and friend-code key derivation (Argon2id).
argon2 = "0.6"
# XChaCha20-Poly1305 for the keystore and code records.
chacha20poly1305 = "0.11"
# Safety number and other derivations.
blake3 = "1.8"
# The mesh1… ID text with its bech32m checksum.
bech32 = "0.12"
# Device-link key exchange. 0.5 is a pre-release but RustCrypto's current line: it
# shares curve25519-dalek 5 and sha2 0.11 with everything else, where 0.4 pulled in
# their old majors. Pinned exactly; move to 0.5.0 when it ships.
spake2 = { version = "=0.5.0-pre.0", features = ["getrandom"] }
# Wiping secrets from memory.
zeroize = { version = "1", features = ["derive"] }
# The password strength check (refuses weak passwords).
zxcvbn = "3"
# "Keep unlocked on this device": Credential Manager / Secret Service.
keyring = "4"
# OS randomness.
getrandom = "0.4"
# Encoding the encrypted keystore payload only (never signed bytes).
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
# The helper's JSON-lines protocol on stdio (mesh-node only), as mesh-wa and mesh-dc use.
serde_json = "1"
# Typed errors the UI can show.
thiserror = "2"
# Property tests (dev only).
proptest = "1"
# QUIC dialled by public key: hole punching, relay fallback. Pinned; no metrics, no
# address publishing presets used (SPEC-transport D1, D2).
iroh = { version = "=1.4.1", default-features = false, features = ["tls-ring", "portmapper"] }
# The async runtime iroh runs on (SPEC-transport D8).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "signal"] }
# Olm sessions and Megolm sender chains for end-to-end encryption (SPEC-e2ee D1).
# Pinned; no libolm compatibility, no precomputed tables.
vodozemac = { version = "=0.11.2", default-features = false }

mesh-dm = { path = "crates/mesh-dm" }
mesh-e2ee = { path = "crates/mesh-e2ee" }
mesh-identity = { path = "crates/mesh-identity" }
mesh-transport = { path = "crates/mesh-transport" }

# Friend codes use fixed, deliberately slow Argon2 settings; optimise it in
# debug builds too, so tests don't take minutes.
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
