# Mesh's seed (SPEC-seed), relay-only (D8c as changed): it only dials out,
# to n0's EU relay, and callers reach it through that relay alone. No ports
# are published and nothing needs forwarding; its address is never shown.
#
#   docker compose up -d --build
#   docker compose logs seed | grep ticket   # the seed's ticket
#
# To update, unpack the new source (`git archive <commit>`) into a fresh
# folder and carry over any local compose changes; don't
# unpack over the old tree, which keeps files the new one deleted. The
# project name (`name: mesh`) keeps the same seed-data volume and ticket.
# A rented server for a second seed: what it needs is in SERVER.md.
name: mesh

x-hardened: &hardened
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  user: "65532:65532"

services:
  seed:
    <<: *hardened
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: mesh-seed
    # The relay is in the built-in ticket (helper::SEEDS): change both together.
    command:
      - --relay-only
      - --relay
      - https://euc1-1.relay.n0.iroh.link.
      - --mail
      - --mail-max
      - "2147483648"
    volumes:
      - seed-data:/data
    networks: [default]
    stop_grace_period: 10s

volumes:
  seed-data:
